apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crowcast-same-workload-only
spec:
  # Replace this label in both selectors. Selecting these pods isolates all
  # their ingress; create separate allow policies for HTTP, metrics, health
  # probes, and any other required ports.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: replace-me
  policyTypes:
    - Ingress
  ingress:
    - from:
        # A podSelector without a namespaceSelector only matches this namespace.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: replace-me
      ports:
        - protocol: TCP
          port: 4053
