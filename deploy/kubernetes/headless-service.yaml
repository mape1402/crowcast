apiVersion: v1
kind: Service
metadata:
  name: replace-me-crowcast
spec:
  # DNS must publish a new pod before application readiness, because CrowCast
  # waits for Akka membership before its hosted service finishes starting.
  publishNotReadyAddresses: true
  clusterIP: None
  selector:
    app.kubernetes.io/name: replace-me
  ports:
    - name: crowcast
      protocol: TCP
      port: 4053
      targetPort: 4053
